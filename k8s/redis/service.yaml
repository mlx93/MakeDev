# Redis Service (ClusterIP - Internal Only)
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: zero-to-running-app
  labels:
    app: redis
    tier: cache
spec:
  type: ClusterIP
  selector:
    app: redis
    tier: cache
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
    protocol: TCP

