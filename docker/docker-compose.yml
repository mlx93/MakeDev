services:
  postgres:
    image: postgres:16-alpine
    container_name: ${PROJECT_NAME:-my-app}-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7.2-alpine
    container_name: ${PROJECT_NAME:-my-app}-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
      target: ${DOCKER_BUILD_TARGET:-dev}
    container_name: ${PROJECT_NAME:-my-app}-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/appdb
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret}
      API_PORT: 8080
      NODE_ENV: development
    ports:
      - "8080:8080"
    volumes:
      - ../backend:/app/backend
      - backend-node-modules:/app/backend/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/v1/health || curl -f http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      target: ${DOCKER_BUILD_TARGET:-dev}
    container_name: ${PROJECT_NAME:-my-app}-frontend
    environment:
      VITE_API_URL: http://localhost:8080/api/v1
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app/frontend
      - frontend-node-modules:/app/frontend/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || curl -f http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app-network

volumes:
  postgres-data:
  redis-data:
  backend-node-modules:
  frontend-node-modules:

networks:
  app-network:
    driver: bridge

